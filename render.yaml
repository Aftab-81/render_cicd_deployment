services:
  - type: web
    name: gemini-llm-app
    env: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this manually in the Render dashboard, never in git
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: ALLOWED_ORIGINS
        value: "*"
    autoDeploy: false        # deploys are triggered by the GitHub Actions workflow instead,
                              # so a deploy never happens unless tests passed first
